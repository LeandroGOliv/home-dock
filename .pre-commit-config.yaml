# Install both hook types once per clone:
#   uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Generic secret scanner (API keys, tokens, credentials).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Tuya local keys have no recognisable pattern: compare against the real local values.
  # Binary files too (screenshots, archives): the hook searches raw bytes.
  - repo: local
    hooks:
      - id: block-tuya-secrets
        name: block Tuya secrets (local keys, device IDs, IPs, wizard dumps)
        entry: python scripts/check_tuya_secrets.py
        language: python

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
